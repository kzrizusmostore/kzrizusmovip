<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Halaman Tidak Ditemukan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.box{max-width:380px}
.code{font-size:5rem;font-weight:900;color:#ff2b2b;text-shadow:0 0 20px rgba(255,43,43,.5);line-height:1}
h1{font-size:1.3rem;margin:14px 0 8px}
p{color:#bbb;font-size:.95rem;margin-bottom:26px}
a{display:inline-block;background:#ff2b2b;color:#fff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:14px;transition:.3s}
a:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(255,43,43,.35)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Halaman Tidak Ditemukan</h1>
  <p>Halaman yang kamu cari gak ada atau sudah dipindah.</p>
  <a href="/">Kembali ke Beranda</a>
</div>
</body>
</html>
